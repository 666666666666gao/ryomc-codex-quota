<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryomc · 上游周额度</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#eaf5f1;background:#0c1716}*{box-sizing:border-box}body{margin:0;padding:38px 24px}main{max-width:660px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{letter-spacing:.18em;color:#78c8ad;font-size:12px}h1{font-size:25px;font-weight:550;letter-spacing:-.04em;margin:12px 0 30px}.card{border:1px solid #2a433c;background:linear-gradient(130deg,#1b302a,#11221e);border-radius:22px;padding:30px}.label{font-size:14px;color:#a7c1b6}.number{font-size:78px;font-weight:550;letter-spacing:-.06em;margin:14px 0}.number small{font-size:30px;color:#94b4a6}progress{width:100%;height:12px;accent-color:#62deb0;margin:0 0 26px}dl{border-top:1px solid #304a40;margin:0;padding-top:22px;display:grid;grid-template-columns:100px 1fr;gap:14px;font-size:13px}dt{color:#9bb9ac}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}button{border:1px solid #507060;background:#24483a;color:#d9ffeb;border-radius:9px;padding:10px 17px;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{font-size:13px;color:#a8bfb4;line-height:1.8}#error{color:#ffc9a3;white-space:pre-wrap}details{margin-top:24px;border-top:1px solid #2a433c;padding-top:20px}summary{cursor:pointer;font-size:14px}label{display:block;font-size:13px;margin-top:18px;color:#bad0c5}input{display:block;width:100%;margin-top:8px;padding:12px;background:#142821;color:#edfff5;border:1px solid #385747;border-radius:8px}form button{margin-top:20px}footer{font-size:11px;color:#718b7e;line-height:1.8;margin-top:24px}.badge{font-size:11px;padding:5px 8px;border:1px solid #385747;border-radius:30px;color:#a8cbb9}@media(max-width:420px){body{padding:24px 14px}.card{padding:22px}.number{font-size:64px}}
</style></head><body><main><header><div class="brand">RYOMC / CODEX QUOTA</div><span class="badge">只读查询</span></header><h1>上游周额度</h1><section class="card"><div class="label">本周剩余比例</div><div class="number"><span id="remaining">—</span><small> %</small></div><progress id="bar" max="100" value="0" aria-label="周额度剩余比例"></progress><dl><dt>下次重置</dt><dd id="reset">等待查询</dd><dt>查询时间</dt><dd id="time">—</dd><dt>时区</dt><dd>北京时间 UTC+8</dd></dl></section><p id="status" role="status">仅显示 CPA 上游周额度，不是 New API 钱包余额。</p><p id="error" role="alert"></p><button id="refresh">刷新额度</button><details id="settings"><summary>连接设置</summary><p>仅供管理员自用。填写 CPA 管理中心的地址和管理密钥，不是 New API 模型调用密钥。密钥仅保存到本机用户目录，不会回传到页面或写入 Git 仓库。</p><form id="config"><label>CPA 管理地址（不含 management.html）<input name="baseUrl" type="url" placeholder="https://cpa.example.com" required autocomplete="off"></label><label>CPA 管理密钥<input name="managementKey" type="password" required autocomplete="off"></label><label>账号 auth_index（只有一个 Codex 账号时可留空）<input name="authIndex" autocomplete="off"></label><label>ChatGPT Account ID（元数据未提供时填写）<input name="accountId" autocomplete="off"></label><button type="submit">保存到本机并查询</button></form></details><footer>数据为最近一次手动查询快照，不自动轮询。查询成功不代表所有模型均可调用。此工具不修改代理、账号调度或计费配置。</footer></main><script src="/app.js"></script></body></html>
